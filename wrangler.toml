name = "franklinone-code"
main = ".open-next/worker.js"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "franklinone-code-cache"

[observability]
enabled = true